<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italyancha Test</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #009246 33%, #ffffff 33%, #ffffff 66%, #ce2b37 66%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-cat {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-cat.active {
            background-color: #009246;
            color: white;
            border-color: #009246;
        }

        .card {
            background: #fdfdfd;
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 20px;
        }

        .question-word {
            font-size: 30px;
            font-weight: bold;
            color: #ce2b37;
            margin: 10px 0 20px 0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background: #fff;
            border: 2px solid #e0e0e0;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-option:hover {
            background: #f5f5f5;
        }

        .btn-option.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }

        .btn-option.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }

        .feedback {
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
            margin-top: 15px;
        }

        .feedback.success { color: #28a745; }
        .feedback.fail { color: #dc3545; }

        .btn-next {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇮🇹 Italyancha Test</h1>

    <div class="categories">
        <button class="btn-cat active" onclick="selectCategory('all', this)">🔄 Aralash</button>
        <button class="btn-cat" onclick="selectCategory('mevalar', this)">🍎 Mevalar</button>
        <button class="btn-cat" onclick="selectCategory('hayvonlar', this)">🐶 Hayvonlar</button>
        <button class="btn-cat" onclick="selectCategory('tana', this)">🧠 Tana a'zolari</button>
        <button class="btn-cat" onclick="selectCategory('oila', this)">👨‍👩‍👧 Oila</button>
<button class="btn-cat" onclick="selectCategory('ranglar', this)">🎨 Ranglar</button>
        <button class="btn-cat" onclick="selectCategory('kasblar', this)">👨‍🍳 Kasblar</button>
        <button class="btn-cat" onclick="selectCategory('umumiy', this)">📚 Umumiy so'zlar</button>
    </div>

    <div class="card">
        <div style="color: #666; font-size: 14px;">O'zbekcha tarjimasini toping:</div>
        <div class="question-word" id="question">-</div>
        
        <div class="options" id="options"></div>

        <div class="feedback" id="feedback"></div>
        <button class="btn-next" id="next-btn" onclick="nextQuestion()">Keyingisi ➔</button>
    </div>
</div>

        // KASBLAR
        { italian: "il dottore", uzbek: "Shifokor", category: "kasblar" },

        { italian: "il cuoco", uzbek: "Oshpaz", category: "kasblar" },
        { italian: "il pilota", uzbek: "Uchuvchi", category: "kasblar" },

        // UMUMIY
        { italian: "la casa", uzbek: "Uy", category: "umumiy" },
        { italian: "il paese", uzbek: "Davlat", category: "umumiy" },
        { italian: "la sedia", uzbek: "Stul", category: "umumiy" },
        { italian: "il treno", uzbek: "Poyezd", category: "umumiy" },
        { italian: "la finestra", uzbek: "Deraza", category: "umumiy" }
    ];

    let currentCategory = 'all';
    let filteredWords = [];
    let currentQuestion = null;
    let isAnswered = false;

    function selectCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initQuiz();
    }
function initQuiz() {
        if (currentCategory === 'all') {
            filteredWords = [...dictionary];
        } else {
            filteredWords = dictionary.filter(w => w.category === currentCategory);
        }
        nextQuestion();
    }

    function nextQuestion() {
        isAnswered = false;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('next-btn').style.display = 'none';

        if (filteredWords.length === 0) {
            document.getElementById('question').innerText = "Savollar tugadi!";
            document.getElementById('options').innerHTML = '';
            return;
        }

        const randomIndex = Math.floor(Math.random() * filteredWords.length);
        currentQuestion = filteredWords[randomIndex];

        document.getElementById('question').innerText = currentQuestion.italian;

        let allUzbekWords = [...new Set(dictionary.map(d => d.uzbek))];
        let wrongOptions = allUzbekWords.filter(w => w !== currentQuestion.uzbek);
        
        wrongOptions.sort(() => 0.5 - Math.random());
        let options = wrongOptions.slice(0, 3);
        options.push(currentQuestion.uzbek);
        options.sort(() => 0.5 - Math.random());

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        options.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = option;
            btn.onclick = function() { checkAnswer(option, btn); };
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption, btn) {
        if (isAnswered) return;
        isAnswered = true;

        const feedbackEl = document.getElementById('feedback');
        const allButtons = document.querySelectorAll('.btn-option');

        if (selectedOption === currentQuestion.uzbek) {
            btn.classList.add('correct');
            feedbackEl.innerText = "Bravo! Zo'r! 👏 Perfetto!";
            feedbackEl.classList.add('success');
        } else {
            btn.classList.add('wrong');
            feedbackEl.innerText = "Ehhh😔 To'g'ri javob: " + currentQuestion.uzbek;
            feedbackEl.classList.add('fail');

            allButtons.forEach(b => {
                if (b.innerText === currentQuestion.uzbek) {
                    b.classList.add('correct');
                }
            });
        }

        document.getElementById('next-btn').style.display = 'block';
    }

    // Dasturni yurgizish
    initQuiz();
</script>

</html>
